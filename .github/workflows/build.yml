name: Build and Test (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows MSVC (JUCE + CMake)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache JUCE Framework
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: ${{ runner.os }}-juce-7.0.12

      - name: Fetch JUCE (if not cached)
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Armoni Composer & Unit Tests
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Show Compiler Error Details on Failure
        if: failure()
        shell: bash
        run: |
          echo "=== BUILD FAILURE LOG SNIPPET ==="
          grep -i -E -C 3 "error|fatal|fail" build.log | tail -n 120 || true

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Run Automated Test Suite
        shell: pwsh
        run: |
          .\build\ArmoniComposer_Tests_artefacts\Release\ArmoniComposer_Tests.exe


      - name: Upload Armoni Composer Windows Executable
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ArmoniComposer-Windows-x64
          path: build/ArmoniComposer_artefacts/Release/ArmoniComposer.exe
